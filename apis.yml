name: Infostellar
description: >-
  Infostellar is a Tokyo-based space infrastructure company that operates
  StellarStation, a cloud ground-station-as-a-service (GSaaS) platform. It
  aggregates partner and operator antennas into a shared global network so
  satellite operators can discover and reserve upcoming passes, schedule and
  cancel plans, manage two-line element (TLE) orbital data, and stream live
  telemetry and commands to and from their spacecraft. StellarStation exposes
  a public gRPC API (defined with Protocol Buffers) at api.stellarstation.com,
  with precompiled client stubs published for Java, Python, Go, and Node.js and
  authentication handled via JWT bearer service-account credentials issued from
  the StellarStation Console. The API separates a satellite-operator service
  (StellarStationService) from a ground-station-operator service
  (GroundStationService), plus supporting definitions for antennas, radios,
  orbit, monitoring, and transport.
