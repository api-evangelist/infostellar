apis:
- name: StellarStation API
  description: >-
    Public gRPC API for the StellarStation ground-station-as-a-service platform.
    Lets satellite operators list upcoming available passes, reserve and cancel
    plans, add and retrieve TLE orbital data, set plan metadata, and open a
    bidirectional stream of satellite telemetry and commands; a companion
    GroundStationService lets antenna operators manage unavailability windows,
    list and cancel plans, and open a ground-station stream.
